<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
    <!-- Фон -->
    <circle cx="200" cy="200" r="180" fill="#e8f4fd"/>

    <!-- Доска -->
    <rect x="80" y="120" width="240" height="180" rx="12" fill="#ffffff" stroke="#3498db" stroke-width="3"/>

    <!-- Заголовок доски -->
    <rect x="100" y="140" width="120" height="14" rx="7" fill="#2c3e50"/>

    <!-- Три колонки-карточки -->
    <rect x="100" y="170" width="60" height="40" rx="6" fill="#fdf2e9" stroke="#e67e22" stroke-width="2"/>
    <rect x="170" y="170" width="60" height="40" rx="6" fill="#e8f4fd" stroke="#3498db" stroke-width="2"/>
    <rect x="240" y="170" width="60" height="40" rx="6" fill="#e8f8ef" stroke="#27ae60" stroke-width="2"/>

    <!-- Второй ряд -->
    <rect x="100" y="220" width="60" height="40" rx="6" fill="#fdf2e9" stroke="#e67e22" stroke-width="2"/>
    <rect x="170" y="220" width="60" height="40" rx="6" fill="#e8f4fd" stroke="#3498db" stroke-width="2"/>

    <!-- Галочка -->
    <circle cx="290" cy="90" r="30" fill="#27ae60"/>
    <path d="M278 90 L288 100 L303 82" stroke="#fff" stroke-width="4" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Декор -->
    <circle cx="60" cy="80" r="8" fill="#3498db" opacity="0.5"/>
    <circle cx="340" cy="330" r="12" fill="#e67e22" opacity="0.5"/>
    <circle cx="50" cy="320" r="6" fill="#27ae60" opacity="0.5"/>
</svg>